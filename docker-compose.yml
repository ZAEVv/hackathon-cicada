# Witness ledger node template (services witness-1..3 below).
x-witness: &witness
  image: smart-caspian-transit
  pull_policy: never  # built by the app service
  entrypoint: ["python", "-m", "backend.app.witness_node"]
  networks: [ledger]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
    interval: 15s
    timeout: 5s
    start_period: 10s
    retries: 3

x-witness-env: &witness-env
  WITNESS_HOST: 0.0.0.0
  WITNESS_PORT: "8100"
  WITNESS_DB_PATH: /data/witness.sqlite3
  LEDGER_WITNESS_KEYS: ${LEDGER_WITNESS_KEYS:-}

services:
  app:
    build: .
    image: smart-caspian-transit
    ports:
      # Published on the host's loopback only, matching the project's threat model.
      - "127.0.0.1:5173:5173"
    environment:
      # Pass through from the shell or a .env file next to this compose file (all optional).
      BROKER_TOKEN: ${BROKER_TOKEN:-}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:-}
      DISABLE_DEFAULT_TOKENS: ${DISABLE_DEFAULT_TOKENS:-}
      # Legacy names, still accepted as fallbacks.
      DEMO_BROKER_TOKEN: ${DEMO_BROKER_TOKEN:-}
      DEMO_REVIEWER_TOKEN: ${DEMO_REVIEWER_TOKEN:-}
      DEMO_DISABLE_DEFAULT_TOKENS: ${DEMO_DISABLE_DEFAULT_TOKENS:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      LEDGER_WITNESS_KEYS: ${LEDGER_WITNESS_KEYS:-}
      # Witness ledger: three separate node services on the internal "ledger" network.
      LEDGER_WITNESS_URLS: ${LEDGER_WITNESS_URLS:-witness-1=http://witness-1:8100,witness-2=http://witness-2:8100,witness-3=http://witness-3:8100}
      # Corridor graph (Neo4j). An empty GRAPH_DB_URL selects the in-memory networkx fallback.
      GRAPH_DB_URL: ${GRAPH_DB_URL-bolt://graph:7687}
      GRAPH_DB_USER: ${GRAPH_DB_USER:-neo4j}
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD:-caspian-graph-local}
    networks: [default, ledger]
    depends_on:
      graph:
        condition: service_healthy
      # Witnesses only need to be started: the API tolerates an unreachable node.
      witness-1:
        condition: service_started
      witness-2:
        condition: service_started
      witness-3:
        condition: service_started
    volumes:
      - caspian-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Corridor network as a graph (hubs + scheduled services), queried with Cypher by the API.
  # Internal only: no published ports; reachable from the app as bolt://graph:7687.
  graph:
    image: neo4j:5.26.10-community
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_DB_PASSWORD:-caspian-graph-local}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
    mem_limit: 1280m
    volumes:
      - caspian-graph:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true

  # --- witness ledger nodes (see backend/app/witness_node.py) -------------------------
  # Same image, different command; each node has its own volume and key, is reachable only
  # on the internal "ledger" network (no host ports, no outbound internet) and runs hardened.
  witness-1:
    <<: *witness
    environment:
      <<: *witness-env
      WITNESS_NODE_ID: witness-1
    volumes:
      - witness-1-data:/data
  witness-2:
    <<: *witness
    environment:
      <<: *witness-env
      WITNESS_NODE_ID: witness-2
    volumes:
      - witness-2-data:/data
  witness-3:
    <<: *witness
    environment:
      <<: *witness-env
      WITNESS_NODE_ID: witness-3
    volumes:
      - witness-3-data:/data

networks:
  ledger:
    internal: true

volumes:
  caspian-data:
  caspian-graph:
  witness-1-data:
  witness-2-data:
  witness-3-data:
